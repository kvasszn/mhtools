[package]
name = "mh1tool"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.103"
binrw = "0.15.1"
bytemuck = { version = "1.25.0", features = ["derive", "min_const_generics"] }
byteorder = "1.5.0"
clap = { version = "4.6.1", features = ["derive"] }
gltf-json = { version = "1.4.1", features = ["names"] }
image = { version = "0.25.10", features = ["png"] }
num_enum = "0.7.6"
serde_json = "1.0.150"
